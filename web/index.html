<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2433" />
    <link rel="icon" type="image/svg+xml" href="/brand/naf-mark-dark.svg" />
    <title>مستشار ناف — منصة الاستشارات القانونية الذكية</title>
    <script>
      // ضبط المظهر مبكرًا لتفادي الوميض.
      // الآلية صنف `dark` على الجذر — وهي آلية ثيم ناف نفسها،
      // لا سمة data-theme المحلية التي كانت مصدر حقيقة موازياً.
      // المفتاح لا يُخزَّن إلا عند اختيار صريح، فغيابه معناه «يتبع النظام».
      (function () {
        try {
          var saved = localStorage.getItem('naf-theme');
          var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
