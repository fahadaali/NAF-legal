name = "naf-legal"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# الواجهة الثابتة (Vite build) تُقدَّم عبر Workers Assets
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# الوسيط قبل الأصول. بالقيمة الافتراضية (false) تُقدَّم الأصول المطابِقة —
# ومنها `index.html` على الجذر — دون أن يعمل Worker أصلاً، فتُحمَّل قشرة
# الواجهة لزائر بلا جلسة ولا يُحوَّل إلى المركز. والحماية عندئذ تقتصر على
# `/api/*`، وهو ما يخالف «وأي مسار غيرها محمي افتراضياً».
run_worker_first = true

# ── قاعدة البيانات D1 ──
[[d1_databases]]
binding = "DB"
database_name = "naf_legal"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# ── تخزين الملفات R2 ──
[[r2_buckets]]
binding = "R2"
bucket_name = "naf-legal-files"

# ── البحث المتجهي Vectorize (اختياري — لتفعيل RAG) ──
# لتفعيل الاسترجاع الدلالي وبحث المحادثات، أنشئ الفهرسين ثم أزِل التعليق:
#   wrangler vectorize create naf-legal-kb   --dimensions=1024 --metric=cosine
#   wrangler vectorize create naf-legal-conv --dimensions=1024 --metric=cosine
# (يتطلّب أن يملك رمز API صلاحية Vectorize)
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "naf-legal-kb"
# [[vectorize]]
# binding = "CONV_VECTORIZE"
# index_name = "naf-legal-conv"

# ── الذكاء الاصطناعي للتضمينات Workers AI ──
[ai]
binding = "AI"

# ── الجلسات وحدود المعدل KV ──
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# ── الدخول الموحّد: مساحة تخصّ المصادقة وحدها ──
#
# مساحة مستقلّة لا توجيهٌ إلى `KV` أعلاه. مفاتيح الحزمة (`sess:` و `jwks:`)
# لا تزاحم مفاتيح حدّ المعدّل (`rl:`) تقنياً، لكن خلطهما يجعل مسح مساحة
# واحدة يُسقط الاثنين معاً، ويمنع ضبط سياسة بقاء مختلفة لكلٍّ منهما.
#
# والمعرّف يُلتزَم في الملف لا في اللوحة: النشر من Workers Builds يقرأ
# `wrangler.toml` ويجعل ما فيه هو الحقيقة، فربطٌ يُضاف من `Settings ← Bindings`
# يمحوه أوّل نشر. وهو عنوان مساحة لا مفتاح وصول، فلا سرّ فيه.
#
# أنشئها من اللوحة (`Storage & Databases ← KV ← Create a namespace`) باسم
# `naf-legal-AUTH_KV`، أو:  npx wrangler kv namespace create AUTH_KV
# ثم ضع المعرّف (٣٢ محرفاً ست عشرياً) مكان القيمة أدناه — أو شغّل
# `scripts/setup-cloudflare.sh` فيملأها.
#
# ولا تستعمل `--update-config`: يضيف كتلة ثانية بجانب هذه فيصير ربطان
# باسم واحد والنشر يفشل.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "REPLACE_WITH_AUTH_KV_ID"

# ملاحظة: أُزيل Queues لدعم الخطة المجانية؛ يُنفَّذ التضمين مباشرةً عبر
# ctx.waitUntil بعد رفع وثيقة قاعدة المعرفة.

# ── المهام المجدولة (تتبّع الأنظمة) ──
[triggers]
crons = ["0 3 * * *"]

[vars]
# القيم غير السرّية فقط. الأسرار عبر: wrangler secret put
APP_NAME = "مستشار ناف"
# مُوحَّد على Opus 4.8 لكل مراحل Claude (التخطيط/التصنيف/الاستخراج/التحقّق/التوليد)
PLANNER_MODEL = "claude-opus-4-8"
GENERATION_MODEL = "claude-opus-4-8"
EMBEDDING_MODEL = "@cf/baai/bge-m3"
DATA_REGION = "auto"

# ── الدخول الموحّد ──
# متغيّران غير سريّين، وهما وحدهما ما يختلف بين منصة وأخرى. يُكتبان هنا لا
# في اللوحة: لا سرّ فيهما، وقيمتهما جزء من إعداد المنصة تُراجَع مع الكود.
#
# `PLATFORM_ID` هو `aud` في الرمز، **والمقارنة حرفية ولا تُطبَّع**: حرف واحد
# بحالة أخرى يجعل كل رمز صحيح يُرفض، والرفض صامت. فهو `NAF-legal` بنصف
# أحرفه كبيرة كما هو مسجَّل في المركز — لا `naf-legal` ولا `NAF-Legal`.
#
# و`AUTH_ISSUER` بلا شرطة أخيرة: `iss` يُقارَن حرفياً كذلك.
PLATFORM_ID = "NAF-legal"
AUTH_ISSUER = "https://naf-id.pages.dev"

# الأسرار المطلوبة (لا تُوضع هنا):
#   ANTHROPIC_API_KEY   — مفتاح Claude API
#   JWT_SECRET          — سرّ توقيع الجلسات
#   AUTH_CLIENT_SECRET  — سرّ هذه المنصة لدى المركز:
#                         wrangler secret put AUTH_CLIENT_SECRET
