name: نشر مستشار ناف على Cloudflare

# نشر ذاتي التجهيز: يُنشئ موارد Cloudflare إن لم تكن موجودة، يحقن معرّفاتها في
# wrangler.toml، يطبّق الترحيلات، ثم ينشر — دون أي عمل من الطرفية.
#
# المطلوب مرّة واحدة: أضِف في GitHub › Settings › Secrets and variables › Actions
#
#   Secrets:
#     CLOUDFLARE_API_TOKEN   — رمز بصلاحيات: Workers Scripts, D1, KV, R2, Queues, Vectorize (Edit)
#     CLOUDFLARE_ACCOUNT_ID  — معرّف حسابك في Cloudflare
#     AUTH_CLIENT_SECRET     — سرّ هذه المنصة لدى مركز الهوية naf-id
#
#   Variables:
#     PLATFORM_ID            — معرّف المنصة في جدول `platforms` بالمركز
#     AUTH_ISSUER            — نطاق المركز، بالصيغة https://…
#
# الثلاثة الأخيرة إلزامية: النشر يتوقّف قبل بلوغ Cloudflare إن نقص أحدها.
# أما سرّا التطبيق (ANTHROPIC_API_KEY و JWT_SECRET) فتُضافان بعد أول نشر من لوحة
# Cloudflare (Workers › الإعداد › Variables and Secrets) لتبقى داخل Cloudflare فقط.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: |
          npm ci
          npm --prefix web ci

      - name: بناء الواجهة
        run: npm run build:web

      - name: تجهيز موارد Cloudflare (idempotent)
        run: |
          set +e
          npx wrangler d1 create naf_legal
          npx wrangler r2 bucket create naf-legal-files
          npx wrangler kv namespace create KV
          npx wrangler kv namespace create AUTH_KV
          # فهارس Vectorize اختيارية (تتطلّب صلاحية Vectorize في الرمز):
          npx wrangler vectorize create naf-legal-kb   --dimensions=1024 --metric=cosine
          npx wrangler vectorize create naf-legal-conv --dimensions=1024 --metric=cosine
          true

      - name: حقن المعرّفات في wrangler.toml
        run: |
          set -euo pipefail
          D1_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="naf_legal") | .uuid' | head -1)
          NS=$(npx wrangler kv namespace list)
          # المطابقة على البادئة الفاصلة لا على "KV" وحدها: عنوان مساحة
          # الدخول الموحّد ينتهي بـ "KV" أيضاً، فـ endswith("KV") يلتقط
          # الاثنتين ويعطي أوّلَهما للاثنتين — فيتشاركان مساحةً واحدة بصمت.
          KV_ID=$(echo "$NS" | jq -r '.[] | select(.title|endswith("-KV")) | .id' | head -1)
          AUTH_KV_ID=$(echo "$NS" | jq -r '.[] | select(.title|endswith("-AUTH_KV")) | .id' | head -1)
          if [ -z "$D1_ID" ] || [ -z "$KV_ID" ] || [ -z "$AUTH_KV_ID" ]; then
            echo "تعذّر الحصول على معرّفات D1/KV/AUTH_KV — تحقّق من صلاحيات الرمز." >&2
            echo "$NS" >&2
            exit 1
          fi
          if [ "$KV_ID" = "$AUTH_KV_ID" ]; then
            echo "::error::مساحة الدخول الموحّد هي نفسها مساحة حدّ المعدّل — يجب فصلهما" >&2
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_ID/$D1_ID/" wrangler.toml
          sed -i "s/REPLACE_WITH_KV_ID/$KV_ID/" wrangler.toml
          sed -i "s/REPLACE_WITH_AUTH_KV_ID/$AUTH_KV_ID/" wrangler.toml
          echo "D1=$D1_ID  KV=$KV_ID  AUTH_KV=$AUTH_KV_ID"

      # المعرّف والمُصدِر قيمتان عاديتان في `[vars]` بـ wrangler.toml ولا
      # يُحقنان: ليسا سرّين، ومكانُهما الملفُّ حيث يقرؤهما المراجع. وهذه
      # الخطوة تتحقّق منهما ولا تكتبهما — نشرٌ بقيمة نائبة يسقط كل طلب
      # بـ 500 لأن الوسيط يحمي كل مسار.
      - name: التحقق من إعداد الدخول الموحّد
        run: |
          set -euo pipefail
          # المعرّف حسّاس لحالة الأحرف: `naf-legal` يرفض كل رمز صحيح، صامتاً.
          if ! grep -q '^PLATFORM_ID = "NAF-legal"$' wrangler.toml; then
            echo "::error::PLATFORM_ID يجب أن يكون NAF-legal بحالة أحرفه — وهو نفسه aud في الرمز" >&2
            grep -n '^PLATFORM_ID' wrangler.toml >&2 || true
            exit 1
          fi
          if ! grep -qE '^AUTH_ISSUER = "https://[^"]+"$' wrangler.toml; then
            echo "::error::AUTH_ISSUER مفقود أو لا يبدأ بـ https://" >&2
            grep -n '^AUTH_ISSUER' wrangler.toml >&2 || true
            exit 1
          fi
          # مساحة الدخول الموحّد مربوطة: بدونها يرمي الإعداد عند أول طلب.
          if ! grep -q 'binding = "AUTH_KV"' wrangler.toml; then
            echo "::error::مساحة AUTH_KV غير مربوطة في wrangler.toml" >&2
            exit 1
          fi
          # مسحة أخيرة: لا تبقى قيمة نائبة واحدة في ملف يُنشر.
          if grep -q "REPLACE_WITH_" wrangler.toml; then
            echo "::error::بقيت قيمة نائبة في wrangler.toml" >&2
            grep -n "REPLACE_WITH_" wrangler.toml >&2
            exit 1
          fi

      - name: ضبط سرّ المنصة لدى المركز
        env:
          AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AUTH_CLIENT_SECRET:-}" ]; then
            echo "::error::اضبط AUTH_CLIENT_SECRET في أسرار المستودع — بدونه تفشل مبادلة رمز العبور" >&2
            exit 1
          fi
          # عبر المدخل القياسي: لا يظهر في سطر أمر ولا في سجلّ التشغيل.
          printf '%s' "$AUTH_CLIENT_SECRET" | npx wrangler secret put AUTH_CLIENT_SECRET

      - name: تطبيق ترحيلات قاعدة البيانات
        run: npx wrangler d1 migrations apply naf_legal --remote

      - name: النشر
        run: npx wrangler deploy
