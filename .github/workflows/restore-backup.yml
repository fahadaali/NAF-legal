name: استعادة من نسخة احتياطية

# استعادةُ القاعدة من نسخةٍ أخذها سير «محو قاعدة المعرفة».
#
# **وهذا آخرُ ما يُلجأ إليه لا أوّلُه.** التراجع عن دفعةٍ في نطاق نظام —
# `POST /api/legal/revert` — أضيقُ نطاقاً وأدقُّ أثراً: يردّ ما مسّته الدفعة
# ويترك ما عداه. وهذا يردّ **كل شيء** إلى لحظة النسخة: المحادثات والأعضاء
# والقضايا وقرارات المراجعة كلُّها تعود إلى ما كانت عليه، وما وقع بعدها يذهب.
#
# فمن أراد ردَّ دفعةٍ معطوبة فليبدأ بذاك المسار. وهذا لعطبٍ يعمّ القاعدة.
#
# ثلاثة حرّاس، كحرّاس المحو:
#   ١) كلمة تأكيد تُكتب بالكامل
#   ٢) `dry_run` مفعَّل افتراضياً: يقول ما في النسخة ولا يستعيد
#   ٣) نسخةٌ من الحال القائمة تُؤخذ قبل الاستعادة — فالاستعادة نفسها لها تراجع

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'رقم تشغيل سير المحو الذي أخذ النسخة (من رابط التشغيل)'
        required: true
        type: string
      confirm:
        description: 'اكتب naf_legal للتأكيد — أيّ شيء آخر يوقف التشغيل'
        required: true
        type: string
      dry_run:
        description: 'قراءةُ النسخة بلا استعادة'
        required: true
        type: boolean
        default: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: حارس التأكيد
        run: |
          if [ "${{ inputs.confirm }}" != "naf_legal" ]; then
            echo "::error::كلمة التأكيد غير مطابقة — لم يقع شيء."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: جلب النسخة من مخرَجات التشغيل
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --name naf_legal-backup --dir backup
          ls -la backup
          echo "أسطر النسخة: $(wc -l < backup/naf_legal-backup.sql)"

      # ما في النسخة يُقرأ قبل أن يُستعاد: عددُ ما ستُرجعه، بجانب ما هو قائم.
      - name: قراءة النسخة ومقابلتها بالقائم
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const sql = readFileSync('backup/naf_legal-backup.sql', 'utf8');
            const count = (t) => (sql.match(new RegExp('INSERT INTO \"?' + t + '\"?', 'g')) ?? []).length;
            for (const t of ['legal_chunks','legal_chunk_versions','legal_review_audit','legal_imports','kb_documents','conversations','messages'])
              console.log(t.padEnd(24), count(t), 'عبارة إدراج');
          "
          echo '── القائم الآن ──'
          npx wrangler d1 execute naf_legal --remote --yes --command "
            SELECT 'legal_chunks' AS الجدول, COUNT(*) AS العدد FROM legal_chunks
            UNION ALL SELECT 'conversations', COUNT(*) FROM conversations
            UNION ALL SELECT 'legal_review_audit', COUNT(*) FROM legal_review_audit
          "

      - name: وقوفٌ عند القراءة
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::قراءةٌ بلا استعادة — لم يُمسّ شيء."
          echo "للاستعادة: أعِد التشغيل مع dry_run = false."

      # نسخةُ الحال القائمة قبل أن تُكتب فوقها. الاستعادة عمليةٌ كبقيّتها،
      # ولها خطأٌ كما لغيرها — فمن استعاد نسخةً خاطئة يجد ما كان قبلها هنا.
      - name: نسخةُ الحال القائمة قبل الاستعادة
        if: ${{ !inputs.dry_run }}
        run: npx wrangler d1 export naf_legal --remote --output pre-restore.sql --skip-confirmation

      - name: رفع نسخة ما قبل الاستعادة
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: naf_legal-pre-restore
          path: pre-restore.sql
          retention-days: 90

      # الاستعادة تُفرّغ ثم تكتب. والملف يحمل `CREATE TABLE` و`INSERT`، فما
      # يُفرَّغ أوّلاً هو ما سيُنشأ ثانيةً — وإلا اصطدم الإنشاء بجدولٍ قائم.
      - name: الاستعادة
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const sql = readFileSync('backup/naf_legal-backup.sql', 'utf8');
            // أسماء الجداول من عبارات الإنشاء في النسخة نفسها — لا قائمةٌ
            // مكتوبة تشيخ مع أوّل جدولٍ جديد.
            const tables = [...sql.matchAll(/CREATE TABLE (?:IF NOT EXISTS )?\"?([A-Za-z_][A-Za-z0-9_]*)\"?/g)]
              .map((m) => m[1]).filter((t) => !t.startsWith('sqlite_') && !t.startsWith('_cf_'));
            const drops = [...new Set(tables)].map((t) => 'DROP TABLE IF EXISTS \"' + t + '\";').join('\n');
            writeFileSync('restore.sql', drops + '\n' + sql);
            console.error('جداولٌ ستُستعاد: ' + new Set(tables).size);
          "
          npx wrangler d1 execute naf_legal --remote --yes --file restore.sql

      # الترحيلات بعد الاستعادة: النسخة من زمنها، وقد صدرت هجراتٌ بعده.
      - name: تطبيق الترحيلات على المستعاد
        if: ${{ !inputs.dry_run }}
        run: npx wrangler d1 migrations apply naf_legal --remote

      - name: إحصاء ما استُعيد
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute naf_legal --remote --yes --command "
            SELECT 'legal_chunks' AS الجدول, COUNT(*) AS العدد FROM legal_chunks
            UNION ALL SELECT 'legal_fts', COUNT(*) FROM legal_fts
            UNION ALL SELECT 'conversations', COUNT(*) FROM conversations
            UNION ALL SELECT 'legal_review_audit', COUNT(*) FROM legal_review_audit
          "
          echo "::notice::الاستعادة تمّت. والمتجهات لم تُستعد — الفهرس المتجهيّ خارج D1."
          echo "لإعادة بنائها: POST /api/legal/embed-pending، أو تنتظر الدورة الليلية."
